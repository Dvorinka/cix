name: release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - run: npm run lint

  test-api:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - run: go test ./...

  desktop:
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - run: just build-desktop

  mobile:
    needs: [lint, test-api]
    outputs:
      aab: ${{ steps.build.outputs.aab_path }}
      version: ${{ steps.build.outputs.version }}
    steps:
      - id: build
        run: cd android && ./gradlew bundleRelease

  deploy:
    needs: [test-api, desktop, mobile]
    steps:
      - run: ./deploy.sh
